; Rumtime product firmware — ESP32-S3 + TB6612FNG
; Runtime model: docs/16-firmware-and-software-architecture.md (ControlTask + queue)
; Board: ESP32-S3-DevKitC-1 (N16R8 module — use default 8MB profile; extra flash unused)

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    bogde/HX711@0.7.5

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; Unity suites under test/test_* are host-only (GpioOps/ScaleOps fakes).
test_ignore = test_*

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<pump_channel.cpp>
    +<pump_bus.cpp>
    +<machine_inputs.cpp>
    +<scale_platform.cpp>
    +<coordinator.cpp>
    +<command_validate.cpp>
    +<config_store.cpp>
    +<command_queue.cpp>
    +<status_snapshot.cpp>
    -<main.cpp>
    -<control_task.cpp>
    -<serial_transport.cpp>
