; Rumtime Phase 0 bench rig — ESP32-S3 + TB6612FNG (2 pumps)
; See docs/14-bench-test-protocol.md and firmware/bench-rig/README.md
; Board: ESP32-S3-DevKitC-1 (N16R8 module — use default 8MB profile; extra flash unused)

[env:esp32-s3-devkitc-1]
; Match controller: official PlatformIO espressif32@8.0.0 (Arduino-ESP32 3.3.12 / IDF 5.5.5).
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Prefer scripts/benchctl.py over pio monitor (cleaner line endings).
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    bogde/HX711@0.7.5

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
