name: UI Kiosk

on:
  push:
    branches: [main]
    paths:
      - "ui/kiosk/**"
      - ".github/workflows/ui-kiosk.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/kiosk/**"
      - ".github/workflows/ui-kiosk.yml"

permissions:
  contents: read

concurrency:
  group: ui-kiosk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kiosk UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui/kiosk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/kiosk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_SETUP_PIN: "0000"
        run: npm run build
