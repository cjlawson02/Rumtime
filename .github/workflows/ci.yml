name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-format:
    name: Check firmware formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check clang-format
        run: pip install pre-commit && pre-commit run clang-format --all-files

  firmware:
    name: Build ${{ matrix.dir }} firmware
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bench-rig, controller]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.dir }}-${{ hashFiles(format('firmware/{0}/platformio.ini', matrix.dir)) }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.dir }}-
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install PlatformIO Core
        run: pip install platformio==6.1.19

      - name: Build firmware
        working-directory: firmware/${{ matrix.dir }}
        run: pio run -e esp32-s3-devkitc-1

      - name: Run native unit tests
        if: matrix.dir == 'controller'
        working-directory: firmware/controller
        run: pio test -e native

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dir }}-firmware-${{ github.sha }}
          path: |
            firmware/${{ matrix.dir }}/.pio/build/esp32-s3-devkitc-1/firmware.bin
            firmware/${{ matrix.dir }}/.pio/build/esp32-s3-devkitc-1/firmware.elf
          if-no-files-found: error
          retention-days: 14
