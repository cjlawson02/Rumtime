[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rumtime-cad"
version = "0.1.0"
description = "Parametric mechanical CAD for Rumtime (build123d)"
requires-python = ">=3.10,<3.15"
dependencies = [
    "build123d>=0.11",
]

[project.optional-dependencies]
preview = [
    "ocp-vscode",
]

[tool.setuptools]
package-dir = {"rumtime_cad" = "src"}
packages = ["rumtime_cad"]
